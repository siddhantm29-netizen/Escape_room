name: Game checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and audit tool
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q app.py escape_room tests
      - name: Test game rules, AI boundaries and Streamlit pages
        run: python -m unittest discover -s tests -v
      - name: Check known dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt --progress-spinner off
